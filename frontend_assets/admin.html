    function App() {
      // Authentication State
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get("login") === "true") return false;
        if (params.get("logout") === "true") {
          localStorage.removeItem("cintamani_admin_auth");
          sessionStorage.removeItem("cintamani_admin_auth");
          return false;
        }
        return localStorage.getItem("cintamani_admin_auth") === "true" ||
               sessionStorage.getItem("cintamani_admin_auth") === "true";
      });

      const handleLogout = () => {
        localStorage.removeItem("cintamani_admin_auth");
        sessionStorage.removeItem("cintamani_admin_auth");
        setIsAuthenticated(false);

      const [isBarcodeSaved, setIsBarcodeSaved] = useState(false);

      // Selected Order lookup
      const currentOrder = useMemo(() => {
        return orders.find(o => o.orderId === selectedOrderId) || orders[0];
      }, [orders, selectedOrderId]);

      // Local draft state for bottom action bar

      const [barcodeDraft, setBarcodeDraft] = useState(currentOrder ? (currentOrder.deliveryBarcode || "") : "");

                      <div>
                        <span className="text-[10px] font-bold uppercase text-neutral-400 block">Slip Deposit Date</span>
                        <span className="font-medium text-neutral-800">{currentOrder.receiptDetails.date}</span>
                      </div>
                    </div>

                    {/* Large Image Viewer for Payment Receipt */}
                    <div className="flex flex-col gap-2">
                      <div className="flex items-center justify-between text-xs font-semibold text-neutral-700">
                        <span className="flex items-center gap-1.5">
                          <span className="material-symbols-outlined text-rose-900 text-base">receipt_long</span>
                          <span>Uploaded Bank Deposit Slip</span>
                        </span>
                        <button
                          type="button"
                          onClick={() => setIsZoomModalOpen(true)}
                          className="text-rose-900 hover:text-rose-950 font-bold flex items-center gap-1 text-[11px]"
                        >
                          <span className="material-symbols-outlined text-sm">fullscreen</span>
                          <span>Enlarge Scan</span>
                        </button>
                      </div>

                      <div 
                        onClick={() => setIsZoomModalOpen(true)}
                        className="relative rounded-xl border border-neutral-200 bg-stone-100 overflow-hidden group cursor-zoom-in flex items-center justify-center min-h-[280px] max-h-[360px]"
                      >
                        <img
                          src={currentOrder.paymentReceiptImg}
                          alt={`Bank receipt slip for order ${currentOrder.orderId}`}
                          className="w-full h-full object-cover object-top group-hover:scale-105 transition-transform duration-300"
                        />
                        
                        {/* Hover Overlay Hint */}
                        <div className="absolute inset-0 bg-neutral-950/25 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                          <span className="px-3.5 py-1.5 rounded-lg bg-black/80 text-white text-xs font-bold flex items-center gap-1.5">
                            <span className="material-symbols-outlined text-sm">zoom_in</span>
                            Click to Inspect Verification Details
                          </span>
                        </div>

                        {/* Stamped badge watermark */}
                        <div className="absolute top-3 left-3">
                          <span className="badge-clean-pill bg-white text-[#800000] border border-neutral-200">
                            <span className="w-1.5 h-1.5 rounded-full bg-rose-700 animate-pulse mr-1.5"></span>
                            Teller Ink Stamp Detected
                          </span>
                        </div>
                      </div>

                      <p className="text-[11px] text-neutral-500 italic text-center font-sans">
                        Verified via official teller ink stamp & branch journal verification.
                      </p>
                    </div>

                    {/* Verification Checklist */}
                    <div className="p-3 bg-rose-50/60 rounded-xl border border-rose-100 text-xs flex items-center gap-2.5 text-neutral-800 font-sans">
                      <span className="material-symbols-outlined text-rose-900 text-lg">verified</span>
                      <div>
                        <strong className="text-rose-900">Financial Ledger Check: </strong>
                        <span>Deposit slip amount matches invoice sum ({currentOrder.amount}).</span>
                      </div>
                    </div>
                  </div>

                  {/* Operational Verification Buttons */}
                  <div className="pt-4 flex flex-col gap-2.5 border-t border-neutral-100">
                    {/* Button 1: Solid Maroon Verify */}
                    <button
                      type="button"
                      onClick={handleVerifyPayment}
                      disabled={currentOrder.status !== "Payment Pending"}
                      className={`w-full py-3 px-4 rounded-xl text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition-all duration-150 ${
                        currentOrder.status === "Payment Pending"
                          ? "bg-rose-900 hover:bg-rose-950 text-white cursor-pointer active:scale-[0.99]"
                          : "bg-neutral-200 text-neutral-400 cursor-not-allowed"
                      }`}
                    >
                      <span className="material-symbols-outlined text-base">check_circle</span>
                      <span>
                        {currentOrder.status === "Payment Pending" 
                          ? "Verify Payment & Accept Order" 
                          : "Payment Already Accepted"}
                      </span>
                    </button>

                    {/* Button 2: Outlined Maroon Re-upload */}
                    <button
                      type="button"
                      onClick={handleRequestReupload}
                      className="w-full py-2.5 px-4 rounded-xl bg-white hover:bg-rose-50 text-rose-900 text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition-colors border-2 border-dashed border-rose-900"
                    >
                      <span className="material-symbols-outlined text-base">restart_alt</span>
                      <span>Request Re-upload</span>
                    </button>
                  </div>

                </div>

              </div>
            </main>
          </div>

          {/* ========================================================= */}
          {/* 3. BOTTOM ACTION BAR: Production Tracking & Logistics */}
          {/* ========================================================= */}
          <footer className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md px-6 py-3.5 border-t-2 border-dashed border-rose-900 shadow-lg z-40 flex flex-wrap items-center justify-between gap-4 font-sans">
            
            {/* Status Dropdown Bound to State */}
            <div className="flex items-center gap-4">
              <div className="flex flex-col">
                <span className="text-[10px] font-bold uppercase tracking-wider text-rose-900">
                  Production Tracking
                </span>
                <span className="text-xs font-bold text-neutral-900">
                  Update Order Lifecycle
                </span>
              </div>

              {/* Status Select dropdown */}
              <div className="relative">
                <select
                  value={statusDraft}
                  onChange={(e) => setStatusDraft(e.target.value)}
                  className="bg-stone-50 border border-neutral-300 text-neutral-900 font-bold text-xs rounded-xl px-3 py-2 pr-8 focus:outline-none focus:border-rose-900 cursor-pointer"
                >
                  {STATUS_ENUM.map(st => (
                    <option key={st} value={st}>{st}</option>
                  ))}
                </select>
              </div>

              {/* Status Stepper visualization pills - Clean flat tags */}
              <div className="hidden xl:flex items-center gap-1.5 pl-2">
                {STATUS_ENUM.map((st, idx) => {
                  const isCurrent = statusDraft === st;
                  return (
                    <React.Fragment key={st}>
                      {idx > 0 && <span className="text-neutral-300 text-xs">›</span>}
                      <button
                        type="button"
                        onClick={() => setStatusDraft(st)}
                        className={`transition-all ${
                          isCurrent
                            ? getStatusBadgeClass(st)
                            : "badge-clean-pill badge-neutral-soft hover:bg-rose-50 hover:text-neutral-900 cursor-pointer"
                        }`}
                      >
                        {st}
                      </button>
                    </React.Fragment>
                  );
                })}
              </div>
            </div>

            {/* Delivery Barcode Input & Action Confirmation */}
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2">
                <label htmlFor="deliveryBarcodeInput" className="text-xs font-bold text-neutral-700 whitespace-nowrap">
                  Delivery Barcode:
                </label>
                
                <div className="relative flex items-center">
                  <span className="material-symbols-outlined text-neutral-400 absolute left-2.5 text-base">
                    barcode_scanner
                  </span>
                  
                  <input
                    id="deliveryBarcodeInput"
                    type="text"
                    value={barcodeDraft}
                    onChange={(e) => setBarcodeDraft(e.target.value)}
                    disabled={!isBarcodeEditable}
                    placeholder={isBarcodeEditable ? "e.g. CM-DOMEX-9920148-LK" : "Requires Packed & Ready state"}
                    className={`pl-8 pr-3 py-1.5 text-xs font-mono font-medium rounded-xl border transition-all w-56 font-mono-code ${
                      isBarcodeEditable
                        ? "bg-white border-2 border-rose-900 text-neutral-900 focus:outline-none focus:ring-1 focus:ring-rose-900"
                        : "bg-neutral-100 border-neutral-300 text-neutral-400 cursor-not-allowed italic"
                    }`}
                  />
                </div>
              </div>

              {/* Save & Update Customer Button */}
              <button
                type="button"
                onClick={handleSaveAndUpdate}
                className={`px-5 py-2 rounded-xl text-xs font-bold uppercase tracking-wider flex items-center gap-2 transition-all duration-150 ${
                  isBarcodeSaved
                    ? "bg-emerald-800 text-white"
                    : "bg-rose-900 hover:bg-rose-950 text-white active:scale-95"
                }`}
              >
                <span className="material-symbols-outlined text-base">
                  {isBarcodeSaved ? "done_all" : "cloud_sync"}
                </span>
                <span>
                  {isBarcodeSaved ? "Logged & Dispatched!" : "Save & Update Customer"}
                </span>
              </button>
            </div>

          </footer>

          {/* ========================================================= */}
          {/* RECEIPT ZOOM / LIGHTBOX MODAL */}
          {/* ========================================================= */}
          {isZoomModalOpen && (
            <div 
              className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 font-sans"
              onClick={() => setIsZoomModalOpen(false)}
            >
              <div 
                className="bg-white rounded-2xl max-w-3xl w-full p-6 flex flex-col gap-4 border-2 border-dashed border-rose-900 relative"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-center justify-between pb-3 border-b border-neutral-200">
                  <div className="flex items-center gap-2">
                    <span className="material-symbols-outlined text-rose-900 text-xl">verified</span>
                    <div>
                      <h3 className="font-sans text-base font-bold text-rose-900">
                        {currentOrder.receiptDetails.bank} Deposit Receipt
                      </h3>
                      <span className="text-xs text-neutral-500 font-mono font-mono-code">
                        Ref: {currentOrder.receiptDetails.reference} • Order #{currentOrder.orderId}
                      </span>
                    </div>
                  </div>
                  <button 
                    onClick={() => setIsZoomModalOpen(false)}
                    className="p-1.5 rounded-lg hover:bg-stone-100 text-neutral-600 hover:text-neutral-900"
                  >
                    <span className="material-symbols-outlined text-xl">close</span>
                  </button>
                </div>

                <div className="max-h-[70vh] overflow-auto flex items-center justify-center bg-stone-100 rounded-xl p-2 border border-neutral-200">
                  <img
                    src={currentOrder.paymentReceiptImg}
                    alt="Enlarged Slip Preview"
                    className="max-h-[65vh] w-auto object-contain rounded-lg"
                  />
                </div>

                <div className="flex items-center justify-between text-xs text-neutral-600 pt-2 border-t border-neutral-100">
                  <span>Teller Counter: <strong>{currentOrder.receiptDetails.tellerStamp}</strong></span>
                  <span className="font-bold text-rose-900 font-mono font-mono-code">Total Verified: {currentOrder.amount}</span>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
