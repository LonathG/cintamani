<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Cintamani — Admin</title>
	<link href="Images/Favicon/favicon.ico" rel="icon" sizes="any" />
	<link href="Images/Favicon/favicon-32.png" rel="icon" type="image/png" sizes="32x32" />
	<link href="Images/Favicon/apple-touch-icon.png" rel="apple-touch-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0" rel="stylesheet" />

  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    // Cintamani palette: dark brown, olive, gold, cream (same as the site and the checkout card)
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { DEFAULT: "#2b1d14", soft: "#5b4a3d", faint: "#8b7b6c" },
            olive: { DEFAULT: "#5f6332", light: "#eef0dc", dark: "#474a24" },
            gold: { DEFAULT: "#c9b46d", light: "#e2d3a8", pale: "#f6efd9" },
            cream: { DEFAULT: "#f4efe3", card: "#fffdf8", line: "#e6dccb" },
            night: { DEFAULT: "#16110c", 2: "#211912", line: "#3a2e22" }
          },
          fontFamily: {
            sans: ["Inter", "system-ui", "-apple-system", "sans-serif"],
            serif: ['"Cormorant Garamond"', "Georgia", "serif"]
          }
        }
      }
    };
  </script>

  <script src="js/shop-data.js"></script>

  <style>
    body { font-family: "Inter", system-ui, sans-serif; }
    .ms { font-family: "Material Symbols Outlined"; font-weight: normal; font-style: normal; line-height: 1; display: inline-block; white-space: nowrap; font-size: 20px; -webkit-font-smoothing: antialiased; font-variation-settings: "wght" 350; }
    .ms-fill { font-variation-settings: "FILL" 1, "wght" 400; }

    /* status pills */
    .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.8; }
    .st-pending { background: #fbecc8; color: #7a4f00; }
    .st-accepted { background: #eef0dc; color: #474a24; }
    .st-production { background: #f5e4d8; color: #7a3e1d; }
    .st-packed { background: #dfecee; color: #1f4f58; }
    .st-dispatched { background: #ebe8e3; color: #4a433b; }
    .st-completed { background: #dcebd9; color: #2f5d3a; }
    .st-cancelled { background: #f3dcd8; color: #8a2c22; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #d6c9b3; border-radius: 99px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="bg-cream text-ink antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback } = React;
    const SHOP = window.CINTAMANI_SHOP || { products: [] };
    const PRODUCT = Object.fromEntries((SHOP.products || []).map((p) => [p.id, p]));

    // --- Order API (netlify/functions/api.mjs) ---
    const TOKEN_KEY = "cintamani_admin_token";
    const getToken = () => localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY);
    const clearToken = () => { localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); };

    class AuthError extends Error {}

    async function api(path, options = {}) {
      const res = await fetch(`/api${path}`, {
        ...options,
        headers: { ...(options.headers || {}), authorization: `Bearer ${getToken()}` }
      });
      if (res.status === 401) { clearToken(); throw new AuthError("Session expired"); }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `Request failed (${res.status})`);
      }
      return res;
    }

    // Order stages, in order. Server values stay the same; the labels match what customers see.
    const STAGES = [
      { value: "Payment Pending", label: "To verify", short: "To verify", cls: "st-pending", icon: "receipt_long", slug: "verify" },
      { value: "Accepted", label: "Accepted", short: "Accepted", cls: "st-accepted", icon: "task_alt", slug: "accepted" },
      { value: "In Production", label: "Tailoring", short: "Tailoring", cls: "st-production", icon: "content_cut", slug: "tailoring" },
      { value: "Packed & Ready", label: "Packed", short: "Packed", cls: "st-packed", icon: "inventory_2", slug: "packed" },
      { value: "Dispatched", label: "Dispatched", short: "Dispatched", cls: "st-dispatched", icon: "local_shipping", slug: "dispatched" },
      { value: "Completed", label: "Completed", short: "Completed", cls: "st-completed", icon: "verified", slug: "completed" },
      { value: "Cancelled", label: "Cancelled", short: "Cancelled", cls: "st-cancelled", icon: "cancel", slug: "cancelled" }
    ];
    // the normal journey of an order (Cancelled sits outside it)
    const PIPELINE = STAGES.filter((s) => s.value !== "Cancelled");
    // finished with: these can be deleted (they stay in the Excel export)
    const isClosed = (o) => o.status === "Completed" || o.status === "Cancelled";
    const stageOf = (status) => STAGES.find((s) => s.value === status) || STAGES[0];
    const stageBySlug = (slug) => STAGES.find((s) => s.slug === slug);

    // The one obvious next step for each stage
    const NEXT_STEP = {
      "Payment Pending": { to: "Accepted", label: "Payment checked — accept order", icon: "check_circle" },
      "Accepted": { to: "In Production", label: "Start tailoring", icon: "content_cut" },
      "In Production": { to: "Packed & Ready", label: "Mark as packed", icon: "inventory_2" },
      "Packed & Ready": { to: "Dispatched", label: "Mark as dispatched", icon: "local_shipping" },
      "Dispatched": { to: "Completed", label: "Delivered — mark as completed", icon: "verified" }
    };

    const lkr = (n) => "LKR " + Number(n || 0).toLocaleString("en-LK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const digits = (v) => String(v || "").replace(/\D/g, "");
    const waNumber = (phone) => { const d = digits(phone); return d.startsWith("0") ? "94" + d.slice(1) : d; };
    const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—";
    const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "";
    const ago = (iso) => {
      if (!iso) return "";
      const m = Math.round((Date.now() - new Date(iso)) / 60000);
      if (m < 1) return "just now";
      if (m < 60) return `${m} min ago`;
      const h = Math.round(m / 60);
      if (h < 24) return `${h} h ago`;
      const d = Math.round(h / 24);
      return `${d} day${d === 1 ? "" : "s"} ago`;
    };
    const itemsLabel = (o) => (o.items || []).map((i) => `${i.name}${i.qty > 1 ? ` ×${i.qty}` : ""}`).join(", ");
    const pieces = (o) => (o.items || []).reduce((n, i) => n + i.qty, 0);

    // --- tiny hash router: #/overview, #/orders, #/orders/verify, #/order/CM-123, #/customers ---
    function useRoute() {
      const read = () => (location.hash.replace(/^#\/?/, "") || "overview").split("/");
      const [route, setRoute] = useState(read);
      useEffect(() => {
        const on = () => setRoute(read());
        window.addEventListener("hashchange", on);
        return () => window.removeEventListener("hashchange", on);
      }, []);
      const go = useCallback((path) => { location.hash = "#/" + path; }, []);
      return [route, go];
    }

    function StatusPill({ status }) {
      const s = stageOf(status);
      return <span className={`pill ${s.cls}`}>{s.label}</span>;
    }

    function Icon({ name, className = "", fill = false }) {
      return <span className={`ms ${fill ? "ms-fill" : ""} ${className}`} aria-hidden="true">{name}</span>;
    }

    // ===================================================================
    // Sign in
    // ===================================================================
    function Login({ onLoginSuccess }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [rememberMe, setRememberMe] = useState(true);
      const [isLoading, setIsLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState(null);
      const [showHelp, setShowHelp] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        setErrorMsg(null);
        setIsLoading(true);
        fetch("/api/admin/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ email: email.trim(), password })
        })
          .then(async (res) => {
            const body = await res.json().catch(() => ({}));
            if (!res.ok || !body.token) throw new Error(body.error || "Those details don't match. Please try again.");
            (rememberMe ? localStorage : sessionStorage).setItem(TOKEN_KEY, body.token);
            onLoginSuccess();
          })
          .catch((err) => {
            setIsLoading(false);
            setErrorMsg(err.message === "Failed to fetch" ? "Can't reach the order server." : err.message);
          });
      };

      const field = "w-full rounded-lg border border-cream-line bg-white px-3.5 py-2.5 text-sm text-ink placeholder-ink-faint focus:border-olive focus:ring-1 focus:ring-olive";

      return (
        <div className="min-h-screen grid lg:grid-cols-2">
          <div className="hidden lg:block relative bg-night">
            <img src="Images/walawwa compressed/CWS (8).jpg" alt="" className="absolute inset-0 w-full h-full object-cover opacity-70" />
            <div className="absolute inset-0 bg-gradient-to-t from-night via-night/30 to-transparent" />
            <div className="absolute bottom-10 left-10 right-10 text-cream">
              <p className="text-[11px] uppercase tracking-[0.3em] text-gold">Cintamani Linens</p>
              <p className="font-serif text-5xl leading-none mt-3">Artistry <em>in Linen</em></p>
            </div>
          </div>

          <div className="flex items-center justify-center p-6">
            <div className="w-full max-w-sm">
              <img src="downloaded_images/logo.png" alt="" className="w-14 h-14 mb-6 invert opacity-80" />
              <h1 className="font-serif text-4xl text-ink">Welcome back</h1>
              <p className="text-sm text-ink-soft mt-1 mb-8">Sign in to manage orders.</p>

              <form onSubmit={handleSubmit} className="flex flex-col gap-4">
                <label className="block">
                  <span className="block text-xs font-semibold text-ink-soft mb-1.5">Email</span>
                  <input type="text" autoComplete="username" required value={email} onChange={(e) => setEmail(e.target.value)} className={field} />
                </label>
                <label className="block">
                  <span className="flex items-center justify-between text-xs font-semibold text-ink-soft mb-1.5">
                    Password
                    <button type="button" onClick={() => setShowHelp(!showHelp)} className="font-medium text-olive hover:underline">Forgot?</button>
                  </span>
                  <input type="password" autoComplete="current-password" required value={password} onChange={(e) => setPassword(e.target.value)} className={field} />
                </label>

                {showHelp && (
                  <p className="text-xs leading-relaxed text-ink-soft bg-gold-pale border border-gold-light rounded-lg p-3">
                    The admin sign-in is set by whoever manages the website hosting (<code>ADMIN_EMAIL</code> and <code>ADMIN_PASSWORD</code>). Ask them to reset it.
                  </p>
                )}

                <label className="flex items-center gap-2 text-sm text-ink-soft select-none cursor-pointer">
                  <input type="checkbox" checked={rememberMe} onChange={(e) => setRememberMe(e.target.checked)} className="rounded border-cream-line text-olive focus:ring-olive" />
                  Keep me signed in on this computer
                </label>

                {errorMsg && (
                  <p className="flex items-center gap-2 text-sm text-red-800 bg-red-50 border border-red-200 rounded-lg px-3 py-2.5">
                    <Icon name="error" className="text-base" /> {errorMsg}
                  </p>
                )}

                <button type="submit" disabled={isLoading} className="mt-2 w-full rounded-lg bg-ink hover:bg-olive text-cream py-3 text-sm font-semibold transition-colors disabled:opacity-70 flex items-center justify-center gap-2">
                  {isLoading ? <><Icon name="progress_activity" className="text-base animate-spin" /> Signing in…</> : <>Sign in <Icon name="arrow_forward" className="text-base" /></>}
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // ===================================================================
    // Layout pieces
    // ===================================================================
    function Sidebar({ route, go, counts, open, onClose, onLogout }) {
      const [view, sub] = route;
      const Item = ({ to, icon, label, count, active, alert }) => (
        <a
          href={"#/" + to}
          onClick={onClose}
          className={`group flex items-center gap-3 rounded-lg px-3 py-2 text-sm transition-colors ${
            active ? "bg-night-2 text-cream" : "text-cream/65 hover:text-cream hover:bg-night-2/60"
          }`}
        >
          <span className={`w-0.5 h-5 -ml-3 mr-0.5 rounded-full ${active ? "bg-gold" : "bg-transparent"}`} />
          <Icon name={icon} className={`text-[19px] ${active ? "text-gold" : "text-cream/50 group-hover:text-cream/80"}`} />
          <span className="flex-1">{label}</span>
          {count !== undefined && count > 0 && (
            <span className={`min-w-[22px] text-center rounded-full px-1.5 py-0.5 text-[11px] font-semibold ${alert ? "bg-gold text-night" : "bg-night-line text-cream/70"}`}>{count}</span>
          )}
        </a>
      );

      return (
        <>
          {open && <div className="fixed inset-0 bg-black/40 z-30 lg:hidden" onClick={onClose} />}
          <aside className={`fixed inset-y-0 left-0 z-40 w-64 bg-night border-r border-night-line flex flex-col transition-transform lg:translate-x-0 ${open ? "translate-x-0" : "-translate-x-full"}`}>
            <div className="flex items-center gap-3 px-5 h-16 border-b border-night-line">
              <img src="downloaded_images/logo.png" alt="" className="w-8 h-8" />
              <div className="leading-tight">
                <p className="font-serif text-lg text-cream">Cintamani <em>Linens</em></p>
                <p className="text-[10px] uppercase tracking-[0.22em] text-gold/80">Admin</p>
              </div>
            </div>

            <nav className="flex-1 overflow-y-auto px-3 py-5 flex flex-col gap-6">
              <div className="flex flex-col gap-0.5">
                <Item to="overview" icon="dashboard" label="Overview" active={view === "overview"} />
                <Item to="orders" icon="receipt" label="All orders" count={counts.all} active={view === "orders" && !sub} />
                <Item to="customers" icon="group" label="Customers" active={view === "customers"} />
              </div>

              <div>
                <p className="px-3 mb-2 text-[10px] font-semibold uppercase tracking-[0.2em] text-cream/35">Order stages</p>
                <div className="flex flex-col gap-0.5">
                  {STAGES.map((s) => (
                    <Item key={s.slug} to={"orders/" + s.slug} icon={s.icon} label={s.label} count={counts[s.value]} alert={s.value === "Payment Pending"} active={view === "orders" && sub === s.slug} />
                  ))}
                </div>
              </div>
            </nav>

            <div className="px-3 py-4 border-t border-night-line flex flex-col gap-0.5">
              {/* the public website, in a new tab so the admin stays open */}
              <a href="index.html" target="_blank" rel="noopener" title="Open the website in a new tab"
                className="group flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-cream/65 hover:text-cream hover:bg-night-2/60">
                <Icon name="home" className="text-[19px] text-cream/50 group-hover:text-gold" />
                <span className="flex-1">Home</span>
                <Icon name="open_in_new" className="text-[16px] text-cream/35 group-hover:text-cream/70" />
              </a>
              <button onClick={onLogout} className="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-cream/65 hover:text-cream hover:bg-night-2/60 text-left">
                <Icon name="logout" className="text-[19px] text-cream/50" /> Sign out
              </button>
            </div>
          </aside>
        </>
      );
    }

    function TopBar({ title, subtitle, onMenu, onRefresh, syncedAt, refreshing, back, onExport }) {
      return (
        <header className="sticky top-0 z-20 bg-cream/95 backdrop-blur border-b border-cream-line">
          <div className="flex items-center gap-3 px-4 sm:px-8 h-16">
            <button onClick={onMenu} className="lg:hidden -ml-1 p-2 rounded-lg hover:bg-cream-line/60" aria-label="Open menu"><Icon name="menu" /></button>
            {back && (
              <a href={back} className="p-2 -ml-2 rounded-lg hover:bg-cream-line/60 text-ink-soft" aria-label="Back"><Icon name="arrow_back" /></a>
            )}
            <div className="flex-1 min-w-0">
              <h1 className="font-serif text-2xl leading-none text-ink truncate">{title}</h1>
              {subtitle && <p className="text-xs text-ink-faint mt-1 truncate">{subtitle}</p>}
            </div>
            <span className="hidden sm:block text-xs text-ink-faint">{syncedAt ? `Updated ${fmtTime(syncedAt)}` : ""}</span>
            <button onClick={onExport} title="Every order (including deleted ones), the pieces, customers and the activity log"
              className="flex items-center gap-1.5 rounded-lg border border-cream-line bg-white px-3 py-1.5 text-xs font-medium text-ink-soft hover:border-olive hover:text-olive transition-colors">
              <Icon name="table_view" className="text-base" /> <span className="hidden sm:inline">Download</span> Excel
            </button>
            <button onClick={onRefresh} className="flex items-center gap-1.5 rounded-lg border border-cream-line bg-white px-3 py-1.5 text-xs font-medium text-ink-soft hover:border-olive hover:text-olive transition-colors">
              <Icon name="refresh" className={`text-base ${refreshing ? "animate-spin" : ""}`} /> Refresh
            </button>
          </div>
        </header>
      );
    }

    const Card = ({ children, className = "" }) => (
      <section className={`bg-cream-card border border-cream-line rounded-xl ${className}`}>{children}</section>
    );
    const CardHead = ({ icon, title, right }) => (
      <div className="flex items-center gap-2 px-5 py-3.5 border-b border-cream-line">
        {icon && <Icon name={icon} className="text-lg text-olive" />}
        <h2 className="text-sm font-semibold text-ink flex-1">{title}</h2>
        {right}
      </div>
    );

    function Empty({ icon, text }) {
      return (
        <div className="flex flex-col items-center justify-center text-center py-14 px-6 text-ink-faint">
          <Icon name={icon} className="text-4xl mb-2 text-cream-line" />
          <p className="text-sm">{text}</p>
        </div>
      );
    }

    // ===================================================================
    // Overview
    // ===================================================================
    function Overview({ orders, counts, go }) {
      const now = new Date();
      const month = orders.filter((o) => {
        const d = new Date(o.createdAt);
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear() && o.status !== "Payment Pending" && o.status !== "Cancelled";
      });
      const revenue = month.reduce((s, o) => s + (o.total || 0), 0);

      const toVerify = orders.filter((o) => o.status === "Payment Pending").sort((a, b) => a.createdAt.localeCompare(b.createdAt));
      const packedNoTracking = orders.filter((o) => o.status === "Packed & Ready" && !o.deliveryBarcode);
      const attention = [
        ...toVerify.map((o) => ({ o, why: "Check the payment slip", icon: "receipt_long" })),
        ...packedNoTracking.map((o) => ({ o, why: "Add tracking number and dispatch", icon: "local_shipping" }))
      ];

      const Stat = ({ label, value, hint, icon, to, tone }) => (
        <a href={"#/" + to} className="group bg-cream-card border border-cream-line rounded-xl p-5 hover:border-olive transition-colors">
          <div className="flex items-center justify-between">
            <span className="text-xs font-medium text-ink-soft">{label}</span>
            <span className={`w-8 h-8 rounded-lg grid place-items-center ${tone}`}><Icon name={icon} className="text-lg" /></span>
          </div>
          <p className="font-serif text-4xl text-ink mt-2 leading-none">{value}</p>
          <p className="text-xs text-ink-faint mt-2 group-hover:text-olive">{hint} →</p>
        </a>
      );

      return (
        <div className="flex flex-col gap-6">
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
            <Stat label="Payments to verify" value={counts["Payment Pending"] || 0} hint="Review slips" icon="receipt_long" to="orders/verify" tone="bg-[#fbecc8] text-[#7a4f00]" />
            <Stat label="Being tailored" value={(counts["Accepted"] || 0) + (counts["In Production"] || 0)} hint="See accepted & tailoring" icon="content_cut" to="orders/tailoring" tone="bg-[#f5e4d8] text-[#7a3e1d]" />
            <Stat label="Ready to dispatch" value={counts["Packed & Ready"] || 0} hint="See packed orders" icon="inventory_2" to="orders/packed" tone="bg-[#dfecee] text-[#1f4f58]" />
            <Stat label={`Confirmed sales · ${now.toLocaleDateString("en-GB", { month: "long" })}`} value={revenue ? Math.round(revenue).toLocaleString("en-LK") : "0"} hint={`LKR · ${month.length} order${month.length === 1 ? "" : "s"}`} icon="payments" to="orders" tone="bg-olive-light text-olive-dark" />
          </div>

          <div className="grid grid-cols-1 xl:grid-cols-5 gap-6 items-start">
            <Card className="xl:col-span-3">
              <CardHead icon="notifications" title="Needs your attention" right={<span className="text-xs text-ink-faint">{attention.length} item{attention.length === 1 ? "" : "s"}</span>} />
              {attention.length === 0 ? (
                <Empty icon="task_alt" text="You're all caught up. New orders will appear here." />
              ) : (
                <ul className="divide-y divide-cream-line">
                  {attention.map(({ o, why, icon }) => (
                    <li key={o.orderId + why}>
                      <a href={"#/order/" + o.orderId} className="flex items-center gap-4 px-5 py-3.5 hover:bg-gold-pale/40">
                        <span className="w-9 h-9 rounded-full bg-gold-pale text-[#7a4f00] grid place-items-center shrink-0"><Icon name={icon} className="text-lg" /></span>
                        <div className="flex-1 min-w-0">
                          <p className="text-sm font-semibold text-ink truncate">{why}</p>
                          <p className="text-xs text-ink-faint truncate">{o.orderId} · {o.customerName} · {o.amount}</p>
                        </div>
                        <span className="hidden sm:block text-xs text-ink-faint shrink-0">{ago(o.createdAt)}</span>
                        <Icon name="chevron_right" className="text-ink-faint" />
                      </a>
                    </li>
                  ))}
                </ul>
              )}

                <ul className="divide-y divide-cream-line">

                    <li key={o.orderId}>
                      <a href={"#/order/" + o.orderId} className="flex items-center gap-3 px-5 py-3 hover:bg-gold-pale/40">

                          <p className="text-sm font-medium text-ink truncate">{o.customerName}</p>

            <div className="grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-7">
              {STAGES.map((s, i) => (
                <a key={s.slug} href={"#/orders/" + s.slug} className={`px-5 py-4 hover:bg-gold-pale/40 ${i ? "sm:border-l" : ""} border-cream-line`}>
                  <span className={`pill ${s.cls}`}>{s.label}</span>

    // ===================================================================
    // Orders list
    // ===================================================================
    function OrdersList({ orders, stage, query, setQuery, onDelete }) {
      const [toDelete, setToDelete] = useState(null);
      const Trash = ({ o }) => isClosed(o) ? (
        <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setToDelete(o); }} title="Delete order"
          className="p-1.5 rounded-lg text-ink-faint hover:text-[#8a2c22] hover:bg-[#f3dcd8]" aria-label={`Delete order ${o.orderId}`}>
          <Icon name="delete" className="text-lg" />
        </button>
      ) : null;
      const list = useMemo(() => {
        const q = query.trim().toLowerCase();
        return orders.filter((o) => {
          if (stage && o.status !== stage.value) return false;
          if (!q) return true;
          return [o.orderId, o.customerName, o.contactNumber, o.email, itemsLabel(o)].join(" ").toLowerCase().includes(q);
        });
      }, [orders, stage, query]);

      const tabs = [{ slug: "", label: "All" }, ...STAGES];

      return (
        <Card>
          <div className="flex flex-col gap-3 px-5 pt-4 pb-3 border-b border-cream-line">
            <div className="flex gap-1 overflow-x-auto -mx-1 px-1">
              {tabs.map((t) => {
                const active = (stage ? stage.slug : "") === t.slug;
                const n = t.slug ? orders.filter((o) => o.status === t.value).length : orders.length;
                return (
                  <a key={t.slug || "all"} href={"#/orders" + (t.slug ? "/" + t.slug : "")}
                    className={`shrink-0 rounded-lg px-3 py-1.5 text-sm transition-colors ${active ? "bg-ink text-cream" : "text-ink-soft hover:bg-cream-line/60"}`}>
                    {t.label} <span className={`ml-1 text-xs ${active ? "text-gold-light" : "text-ink-faint"}`}>{n}</span>
                  </a>
                );
              })}
            </div>
            <div className="relative">
              <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-lg text-ink-faint" />
              <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search by order number, name, phone or piece"
                className="w-full rounded-lg border border-cream-line bg-white pl-10 pr-9 py-2 text-sm placeholder-ink-faint focus:border-olive focus:ring-1 focus:ring-olive" />
              {query && <button onClick={() => setQuery("")} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-ink-faint hover:text-ink" aria-label="Clear search"><Icon name="close" className="text-lg" /></button>}
            </div>
          </div>

          {list.length === 0 ? (
            <Empty icon="search_off" text={query ? "No orders match that search." : "No orders at this stage."} />
          ) : (
            <>
              {/* table on larger screens */}
              <table className="hidden md:table w-full text-sm">
                <thead>
                  <tr className="text-left text-xs text-ink-faint">
                    <th className="font-medium px-5 py-2.5">Order</th>
                    <th className="font-medium px-3 py-2.5">Customer</th>
                    <th className="font-medium px-3 py-2.5">Pieces</th>
                    <th className="font-medium px-3 py-2.5 text-right">Total</th>
                    <th className="font-medium px-3 py-2.5">Placed</th>
                    <th className="font-medium px-3 py-2.5">Stage</th>
                    <th className="w-20" />
                  </tr>
                </thead>
                <tbody className="divide-y divide-cream-line border-t border-cream-line">
                  {list.map((o) => (
                    <tr key={o.orderId} onClick={() => (location.hash = "#/order/" + o.orderId)} className="cursor-pointer hover:bg-gold-pale/40">
                      <td className="px-5 py-3 font-semibold text-ink whitespace-nowrap">{o.orderId}</td>
                      <td className="px-3 py-3">
                        <p className="text-ink">{o.customerName}</p>
                        <p className="text-xs text-ink-faint">{o.contactNumber}</p>
                      </td>
                      <td className="px-3 py-3 text-ink-soft max-w-[260px] truncate">{itemsLabel(o)}</td>
                      <td className="px-3 py-3 text-right font-medium text-ink whitespace-nowrap">{o.amount}</td>
                      <td className="px-3 py-3 text-ink-soft whitespace-nowrap">{fmtDate(o.createdAt)}</td>
                      <td className="px-3 py-3"><StatusPill status={o.status} /></td>
                      <td className="pr-4 text-ink-faint"><span className="flex items-center justify-end gap-1"><Trash o={o} /><Icon name="chevron_right" /></span></td>
                    </tr>
                  ))}
                </tbody>
              </table>

              {/* cards on phones */}
              <ul className="md:hidden divide-y divide-cream-line">
                {list.map((o) => (
                  <li key={o.orderId}>
                    <a href={"#/order/" + o.orderId} className="block px-5 py-3.5 hover:bg-gold-pale/40">
                      <div className="flex items-center justify-between gap-3">
                        <span className="font-semibold text-sm text-ink">{o.orderId}</span>
                        <span className="flex items-center gap-1"><StatusPill status={o.status} /><Trash o={o} /></span>
                      </div>
                      <p className="text-sm text-ink mt-1">{o.customerName}</p>
                      <div className="flex items-center justify-between text-xs text-ink-faint mt-0.5">
                        <span className="truncate pr-3">{itemsLabel(o)}</span>
                        <span className="font-medium text-ink shrink-0">{o.amount}</span>
                      </div>
                    </a>
                  </li>
                ))}
              </ul>
            </>
          )}
          {toDelete && <ConfirmDialog danger title="Delete this order?" text={deleteText(toDelete)} confirmLabel="Delete order"
            onConfirm={() => onDelete(toDelete.orderId)} onClose={() => setToDelete(null)} />}
        </Card>
      );
    }

    // ===================================================================
    // Customers (built from the orders)
    // ===================================================================
    function Customers({ orders, setQuery }) {
      const [q, setQ] = useState("");
      const people = useMemo(() => {
        const map = new Map();
        orders.forEach((o) => {
          const key = (o.customerAccount || o.email || o.contactNumber || o.customerName).toLowerCase();
          const p = map.get(key) || { name: o.customerName, phone: o.contactNumber, email: o.email || o.customerAccount, address: o.shippingAddress, orders: 0, spent: 0, last: o.createdAt };
          p.orders += 1;
          if (o.status !== "Payment Pending") p.spent += o.total || 0;
          if (o.createdAt > p.last) { p.last = o.createdAt; p.name = o.customerName; p.phone = o.contactNumber; p.address = o.shippingAddress; }
          map.set(key, p);
        });
        return [...map.values()].sort((a, b) => b.last.localeCompare(a.last));
      }, [orders]);
      const list = people.filter((p) => !q || [p.name, p.phone, p.email].join(" ").toLowerCase().includes(q.toLowerCase()));

      return (
        <Card>
          <div className="px-5 py-3 border-b border-cream-line">
            <div className="relative">
              <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-lg text-ink-faint" />
              <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search customers"
                className="w-full rounded-lg border border-cream-line bg-white pl-10 pr-3 py-2 text-sm placeholder-ink-faint focus:border-olive focus:ring-1 focus:ring-olive" />
            </div>
          </div>
          {list.length === 0 ? <Empty icon="group" text="No customers yet." /> : (
            <ul className="divide-y divide-cream-line">
              {list.map((p) => (
                <li key={p.email + p.phone} className="flex flex-wrap items-center gap-x-6 gap-y-2 px-5 py-3.5">
                  <div className="w-9 h-9 rounded-full bg-olive-light text-olive-dark grid place-items-center text-sm font-semibold shrink-0">
                    {p.name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase()}
                  </div>
                  <div className="flex-1 min-w-[180px]">
                    <p className="text-sm font-medium text-ink">{p.name}</p>
                    <p className="text-xs text-ink-faint">{[p.phone, p.email].filter(Boolean).join(" · ")}</p>
                  </div>
                  <div className="text-xs text-ink-soft w-28"><span className="block text-ink-faint">Orders</span>{p.orders}</div>
                  <div className="text-xs text-ink-soft w-32"><span className="block text-ink-faint">Confirmed spend</span>{lkr(p.spent)}</div>
                  <div className="text-xs text-ink-soft w-28"><span className="block text-ink-faint">Last order</span>{fmtDate(p.last)}</div>
                  <div className="flex items-center gap-1.5">
                    {p.phone && <a href={`https://wa.me/${waNumber(p.phone)}`} target="_blank" rel="noopener" title="WhatsApp" className="p-2 rounded-lg border border-cream-line hover:border-olive hover:text-olive"><Icon name="chat" className="text-lg" /></a>}
                    <button onClick={() => { setQuery(p.phone || p.name); location.hash = "#/orders"; }} className="rounded-lg border border-cream-line px-3 py-1.5 text-xs font-medium hover:border-olive hover:text-olive">View orders</button>
                  </div>
                </li>
              ))}
            </ul>
          )}
        </Card>
      );
    }

    // Yes / no dialog for anything that can't be undone
    function ConfirmDialog({ title, text, confirmLabel, danger, onConfirm, onClose }) {
      const [busy, setBusy] = useState(false);
      useEffect(() => {
        const onKey = (e) => { if (e.key === "Escape" && !busy) onClose(); };
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, [busy]);
      const go = async () => { setBusy(true); try { await onConfirm(); onClose(); } catch (e) { setBusy(false); } };
      return (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={() => !busy && onClose()}>
          <div role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" className="w-full max-w-md bg-cream-card rounded-xl shadow-xl overflow-hidden" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-start gap-3 px-6 pt-5 pb-4">
              <span className={`w-9 h-9 rounded-full grid place-items-center shrink-0 ${danger ? "bg-[#f3dcd8] text-[#8a2c22]" : "bg-gold-pale text-[#7a4f00]"}`}><Icon name={danger ? "delete" : "help"} className="text-lg" /></span>
              <div className="flex-1">
                <h2 id="confirm-title" className="font-serif text-2xl leading-tight text-ink">{title}</h2>
                <p className="text-sm text-ink-soft mt-1.5 leading-relaxed">{text}</p>
              </div>
            </div>
            <div className="flex items-center justify-end gap-2 px-6 py-4 bg-cream border-t border-cream-line">
              <button onClick={onClose} disabled={busy} className="rounded-lg px-4 py-2 text-sm font-medium text-ink-soft hover:bg-cream-line/60">Keep it</button>
              <button onClick={go} disabled={busy} autoFocus
                className={`flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold text-white disabled:opacity-60 ${danger ? "bg-[#8a2c22] hover:bg-[#6f2219]" : "bg-ink hover:bg-olive"}`}>
                {busy && <Icon name="progress_activity" className="animate-spin text-base" />} {confirmLabel}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // "Delete order" confirmation, shared by the list and the order page
    const deleteText = (o) => `${o.orderId} (${o.customerName}, ${o.amount}) will be removed from the admin. ` +
      "It stays in the Excel download, marked as deleted, so your records are complete. This can't be undone here.";

    async function downloadExcel(toast) {
      try {
        const res = await api("/admin/export.xlsx");
        const blob = await res.blob();
        const name = (res.headers.get("content-disposition") || "").match(/filename="([^"]+)"/)?.[1] || "cintamani-orders.xlsx";
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        toast("Excel file downloaded.");
      } catch (err) { toast(`Couldn't create the Excel file: ${err.message}`, true); }
    }

    // ===================================================================
    // Order detail
    // ===================================================================
    // In-site dialog (replaces the browser prompt): pick a reason, adjust the wording, open WhatsApp
    const RESEND_REASONS = [
      { label: "Slip is unclear", text: "the photo of the slip is unclear, so we can't read the details" },
      { label: "Amount doesn't match", text: "the amount on the slip doesn't match the order total" },
      { label: "Wrong account", text: "the payment seems to have gone to a different account" },
      { label: "Details cut off", text: "part of the slip (date, amount or reference) is cut off" },
      { label: "Not received yet", text: "we can't see this payment in our account yet" }
    ];

    function ResendSlipDialog({ order, onClose }) {
      const [reason, setReason] = useState(RESEND_REASONS[0].text);
      const [picked, setPicked] = useState(0);
      useEffect(() => {
        const onKey = (e) => { if (e.key === "Escape") onClose(); };
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, []);

      const message = `Hello ${order.customerName}, this is Cintamani Linens about your order ${order.orderId} (${order.amount}). ` +
        `Could you please send us your bank transfer slip again? Reason: ${reason.trim() || "—"}. ` +
        `You can reply to this message with a clear photo of the slip. Thank you!`;

      const send = () => {
        window.open(`https://wa.me/${waNumber(order.contactNumber)}?text=${encodeURIComponent(message)}`, "_blank", "noopener");
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={onClose}>
          <div role="dialog" aria-modal="true" aria-labelledby="resend-title" className="w-full max-w-lg bg-cream-card rounded-xl shadow-xl overflow-hidden" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-start gap-3 px-6 pt-5 pb-4 border-b border-cream-line">
              <span className="w-9 h-9 rounded-full bg-gold-pale text-[#7a4f00] grid place-items-center shrink-0"><Icon name="restart_alt" className="text-lg" /></span>
              <div className="flex-1">
                <h2 id="resend-title" className="font-serif text-2xl leading-tight text-ink">Ask for the slip again</h2>
                <p className="text-xs text-ink-faint mt-0.5">{order.customerName} · {order.contactNumber} · {order.orderId}</p>
              </div>
              <button onClick={onClose} className="p-1.5 -mr-1.5 rounded-lg hover:bg-cream text-ink-faint" aria-label="Close"><Icon name="close" /></button>
            </div>

            <div className="px-6 py-5 flex flex-col gap-4">
              <div>
                <p className="text-xs font-semibold text-ink-soft mb-2">What's wrong with the slip?</p>
                <div className="flex flex-wrap gap-2">
                  {RESEND_REASONS.map((r, i) => (
                    <button key={r.label} type="button" onClick={() => { setPicked(i); setReason(r.text); }}
                      className={`rounded-full border px-3 py-1.5 text-xs transition-colors ${picked === i ? "bg-ink border-ink text-cream" : "border-cream-line text-ink-soft hover:border-olive hover:text-olive"}`}>
                      {r.label}
                    </button>
                  ))}
                </div>
              </div>

              <label className="block">
                <span className="block text-xs font-semibold text-ink-soft mb-1.5">Reason (you can edit this)</span>
                <textarea value={reason} onChange={(e) => { setReason(e.target.value); setPicked(-1); }} rows={2} maxLength={240}
                  className="w-full rounded-lg border border-cream-line bg-white px-3 py-2 text-sm focus:border-olive focus:ring-1 focus:ring-olive resize-none" />
              </label>

              <div>
                <p className="text-xs font-semibold text-ink-soft mb-1.5">Message preview</p>
                <div className="rounded-lg bg-[#e7f1dd] border border-[#d3e3c4] px-4 py-3 text-sm text-[#1f2b17] leading-relaxed">{message}</div>
              </div>
            </div>

            <div className="flex items-center justify-end gap-2 px-6 py-4 bg-cream border-t border-cream-line">
              <button onClick={onClose} className="rounded-lg px-4 py-2 text-sm font-medium text-ink-soft hover:bg-cream-line/60">Cancel</button>
              <button onClick={send} disabled={!reason.trim()} className="flex items-center gap-2 rounded-lg bg-[#2f5d3a] hover:bg-[#244a2d] text-white px-4 py-2 text-sm font-semibold disabled:opacity-50">
                <Icon name="chat" className="text-base" /> Open in WhatsApp
              </button>
            </div>
          </div>
        </div>
      );
    }

    function OrderDetail({ order, onSave, onDelete, toast }) {
      const [confirm, setConfirm] = useState(null); // "cancel" | "delete"
      const [slip, setSlip] = useState({ url: null, type: null, error: null });
      const [zoom, setZoom] = useState(false);
      const [tracking, setTracking] = useState(order.deliveryBarcode || "");
      const [busy, setBusy] = useState(false);
      const [showStatus, setShowStatus] = useState(false);

      useEffect(() => { setTracking(order.deliveryBarcode || ""); setShowStatus(false); }, [order.orderId]);

      useEffect(() => {
        let url = null;
        setSlip({ url: null, type: null, error: null });
        if (!order.hasSlip) return;
        api(`/admin/orders/${order.orderId}/slip`)
          .then(async (res) => { const blob = await res.blob(); url = URL.createObjectURL(blob); setSlip({ url, type: blob.type, error: null }); })
          .catch((err) => setSlip({ url: null, type: null, error: err.message }));
        return () => { if (url) URL.revokeObjectURL(url); };
      }, [order.orderId]);

      const stageIdx = PIPELINE.findIndex((s) => s.value === order.status); // -1 when cancelled
      const cancelled = order.status === "Cancelled";
      const next = NEXT_STEP[order.status];
      const needsTracking = next && next.to === "Dispatched";

      const save = async (patch, message) => {
        setBusy(true);
        try { await onSave(order.orderId, patch); toast(message); }
        catch (err) { toast(err.message, true); }
        finally { setBusy(false); }
      };

      const advance = () => {
        if (needsTracking && !tracking.trim()) { toast("Add the courier tracking number first.", true); document.getElementById("tracking").focus(); return; }
        save({ status: next.to, ...(needsTracking ? { deliveryBarcode: tracking.trim() } : {}) }, `${order.orderId} moved to “${stageOf(next.to).label}”.`);
      };

      const [reuploadOpen, setReuploadOpen] = useState(false);
      const askReupload = () => setReuploadOpen(true);

      const notifyCustomer = () => {
        const s = stageOf(order.status);
        const lines = {
          "Payment Pending": "we've received your order and are checking your payment.",
          "Accepted": "your payment is confirmed and your order is accepted.",
          "In Production": "your pieces are now being tailored.",
          "Packed & Ready": "your order is packed and will be dispatched shortly.",
          "Dispatched": `your order is on its way${order.deliveryBarcode ? ` — tracking number ${order.deliveryBarcode}` : ""}.`,
          "Completed": "your order has been delivered. We hope you love your pieces!",
          "Cancelled": "your order has been cancelled. Please reply if you have any questions."
        };
        const text = `Hello ${order.customerName}, this is Cintamani Linens. Good news about order ${order.orderId}: ${lines[order.status] || s.label}. Thank you!`;
        window.open(`https://wa.me/${waNumber(order.contactNumber)}?text=${encodeURIComponent(text)}`, "_blank", "noopener");
      };

      const Row = ({ label, children }) => (
        <div className="py-2.5 grid grid-cols-[110px_1fr] gap-3 text-sm">
          <dt className="text-ink-faint">{label}</dt>
          <dd className="text-ink break-words">{children}</dd>
        </div>
      );

      return (
        <div className="flex flex-col gap-6">
          {/* progress + next step */}
          <Card className="p-5">
            <div className="flex flex-wrap items-center gap-x-6 gap-y-4">
              {cancelled ? (
                <div className="flex items-center gap-3 flex-1 min-w-[300px]">
                  <span className="w-9 h-9 rounded-full bg-[#f3dcd8] text-[#8a2c22] grid place-items-center"><Icon name="cancel" className="text-lg" /></span>
                  <div>
                    <p className="text-sm font-semibold text-ink">This order was cancelled</p>
                    <p className="text-xs text-ink-faint">It no longer counts towards sales. You can delete it once you're done with it.</p>
                  </div>
                </div>
              ) : (
              <ol className="flex items-center flex-1 min-w-[300px]">
                {PIPELINE.map((s, i) => {
                  const done = i < stageIdx, current = i === stageIdx;
                  return (
                    <li key={s.value} className="flex items-center flex-1 last:flex-none">
                      <div className="flex flex-col items-center gap-1.5">
                        <span className={`w-8 h-8 rounded-full grid place-items-center border ${current ? "bg-ink border-ink text-gold" : done ? "bg-olive border-olive text-cream" : "bg-white border-cream-line text-ink-faint"}`}>
                          <Icon name={done ? "check" : s.icon} className="text-[17px]" />
                        </span>
                        <span className={`text-[11px] whitespace-nowrap ${current ? "font-semibold text-ink" : "text-ink-faint"}`}>{s.short}</span>
                      </div>
                      {i < PIPELINE.length - 1 && <span className={`flex-1 h-px mx-2 mb-5 ${i < stageIdx ? "bg-olive" : "bg-cream-line"}`} />}
                    </li>
                  );
                })}
              </ol>
              )}

              <div className="flex flex-col items-stretch gap-2 w-full sm:w-auto">
                {next ? (
                  <button onClick={advance} disabled={busy} className="flex items-center justify-center gap-2 rounded-lg bg-ink hover:bg-olive text-cream px-5 py-2.5 text-sm font-semibold transition-colors disabled:opacity-60">
                    <Icon name={next.icon} className="text-lg" /> {next.label}
                  </button>
                ) : cancelled ? null : (
                  <span className="flex items-center gap-2 rounded-lg bg-olive-light text-olive-dark px-5 py-2.5 text-sm font-semibold"><Icon name="verified" className="text-lg" /> Order complete</span>
                )}
                {isClosed(order) && (
                  <button onClick={() => setConfirm("delete")} disabled={busy}
                    className="flex items-center justify-center gap-2 rounded-lg border border-[#e6c2bc] text-[#8a2c22] hover:bg-[#f3dcd8] px-5 py-2 text-sm font-semibold transition-colors">
                    <Icon name="delete" className="text-lg" /> Delete order
                  </button>
                )}
                <div className="flex items-center justify-center gap-3">
                  <button onClick={() => setShowStatus(!showStatus)} className="text-xs text-ink-faint hover:text-olive">Change stage manually</button>
                  {!isClosed(order) && <button onClick={() => setConfirm("cancel")} className="text-xs text-ink-faint hover:text-[#8a2c22]">Cancel order</button>}
                </div>
              </div>
            </div>

            {showStatus && (
              <div className="mt-4 pt-4 border-t border-cream-line flex flex-wrap items-center gap-2">
                <span className="text-xs text-ink-soft mr-1">Set stage to:</span>
                {STAGES.map((s) => (
                  <button key={s.value} disabled={busy || s.value === order.status}
                    onClick={() => save({ status: s.value }, `${order.orderId} set to “${s.label}”.`)}
                    className={`pill ${s.cls} ${s.value === order.status ? "ring-2 ring-ink/30" : "opacity-70 hover:opacity-100"}`}>{s.label}</button>
                ))}
              </div>
            )}
          </Card>

          <div className="grid grid-cols-1 xl:grid-cols-5 gap-6 items-start">
            <div className="xl:col-span-3 flex flex-col gap-6">
              {/* items */}
              <Card>
                <CardHead icon="checkroom" title={`Pieces (${pieces(order)})`} />
                <ul className="divide-y divide-cream-line">
                  {(order.items || []).map((it, i) => {
                    const p = PRODUCT[it.id];
                    return (
                      <li key={i} className="flex items-center gap-4 px-5 py-3.5">
                        {p ? <img src={p.image} alt="" className="w-14 h-14 rounded-lg object-cover object-top border border-cream-line" /> : <div className="w-14 h-14 rounded-lg bg-cream" />}
                        <div className="flex-1 min-w-0">
                          <p className="text-sm font-medium text-ink">{it.name}</p>
                          <p className="text-xs text-ink-faint">{it.colour} · Size <strong className="text-ink">{it.size}</strong> · Qty {it.qty}</p>
                        </div>
                        <span className="text-sm text-ink whitespace-nowrap">{lkr(it.lineTotal)}</span>
                      </li>
                    );
                  })}
                </ul>
                <dl className="px-5 py-3 border-t border-cream-line text-sm">
                  <div className="flex justify-between py-1 text-ink-soft"><dt>Subtotal</dt><dd>{lkr(order.subtotal)}</dd></div>
                  <div className="flex justify-between py-1 text-ink-soft"><dt>Delivery</dt><dd>{lkr(order.deliveryFee)}</dd></div>
                  <div className="flex justify-between pt-2 mt-1 border-t border-cream-line font-semibold text-ink"><dt>Total</dt><dd>{order.amount}</dd></div>
                </dl>
              </Card>

              {/* payment slip */}
              <Card>
                <CardHead icon="account_balance" title="Payment slip"
                  right={slip.url && <button onClick={() => setZoom(true)} className="flex items-center gap-1 text-xs font-medium text-olive hover:underline"><Icon name="open_in_full" className="text-base" /> Enlarge</button>} />
                <div className="p-5 flex flex-col sm:flex-row gap-5">
                  <button type="button" onClick={() => slip.url && setZoom(true)} className="sm:w-56 h-64 shrink-0 rounded-lg border border-cream-line bg-cream overflow-hidden grid place-items-center cursor-zoom-in">
                    {slip.url && slip.type === "application/pdf" ? (
                      <span className="flex flex-col items-center gap-1 text-sm text-ink-soft"><Icon name="picture_as_pdf" className="text-4xl text-olive" /> PDF slip</span>
                    ) : slip.url ? (
                      <img src={slip.url} alt={`Payment slip for ${order.orderId}`} className="w-full h-full object-cover object-top" />
                    ) : (
                      <span className="text-xs text-ink-faint px-4 text-center">{slip.error ? `Couldn't load slip: ${slip.error}` : order.hasSlip ? "Loading slip…" : "No slip uploaded"}</span>
                    )}
                  </button>
                  <div className="flex-1 flex flex-col">
                    <div className="rounded-lg bg-gold-pale border border-gold-light px-4 py-3 text-sm">
                      <p className="text-xs text-ink-soft">The slip should show</p>
                      <p className="font-serif text-2xl text-ink leading-tight">{order.amount}</p>
                      <p className="text-xs text-ink-soft">paid to <strong>{order.receiptDetails?.account || "Cintamani Linens"}</strong></p>
                    </div>
                    <dl className="divide-y divide-cream-line mt-2">
                      <Row label="Paid from">{order.receiptDetails?.bank || "—"}</Row>
                      <Row label="Reference">{order.receiptDetails?.reference || "—"}</Row>
                      <Row label="Uploaded">{fmtDate(order.createdAt)} · {fmtTime(order.createdAt)}</Row>
                    </dl>
                    {order.status === "Payment Pending" && (
                      <button onClick={askReupload} className="mt-auto self-start flex items-center gap-1.5 rounded-lg border border-cream-line px-3 py-2 text-xs font-medium text-ink-soft hover:border-olive hover:text-olive">
                        <Icon name="restart_alt" className="text-base" /> Ask customer to resend the slip
                      </button>
                    )}
                  </div>
                </div>
              </Card>
            </div>

            <div className="xl:col-span-2 flex flex-col gap-6">
              {/* customer */}
              <Card>
                <CardHead icon="person" title="Customer" />
                <div className="px-5 pt-2 pb-4">
                  <dl className="divide-y divide-cream-line">
                    <Row label="Name">{order.customerName}</Row>
                    <Row label="Phone"><a href={`tel:${order.contactNumber}`} className="hover:text-olive">{order.contactNumber}</a></Row>
                    {(order.email || order.customerAccount) && <Row label="Email"><a href={`mailto:${order.email || order.customerAccount}`} className="hover:text-olive">{order.email || order.customerAccount}</a></Row>}
                    <Row label="Deliver to"><span className="whitespace-pre-line">{order.shippingAddress}</span></Row>
                    {order.notes && <Row label="Note">{order.notes}</Row>}
                  </dl>
                  <div className="grid grid-cols-2 gap-2 mt-3">
                    <a href={`https://wa.me/${waNumber(order.contactNumber)}`} target="_blank" rel="noopener" className="flex items-center justify-center gap-1.5 rounded-lg bg-[#2f5d3a] hover:bg-[#244a2d] text-white px-3 py-2 text-xs font-semibold">
                      <Icon name="chat" className="text-base" /> WhatsApp
                    </a>
                    <button onClick={notifyCustomer} className="flex items-center justify-center gap-1.5 rounded-lg border border-cream-line px-3 py-2 text-xs font-medium text-ink-soft hover:border-olive hover:text-olive">
                      <Icon name="campaign" className="text-base" /> Send stage update
                    </button>
                  </div>
                </div>
              </Card>

              {/* delivery */}
              <Card>
                <CardHead icon="local_shipping" title="Delivery" />
                <div className="p-5 flex flex-col gap-3">
                  <label className="block">
                    <span className="block text-xs text-ink-faint mb-1.5">Courier tracking number</span>
                    <input id="tracking" value={tracking} onChange={(e) => setTracking(e.target.value)} placeholder="e.g. DOMEX 9920148"
                      disabled={stageIdx < 3}
                      className="w-full rounded-lg border border-cream-line bg-white px-3 py-2 text-sm placeholder-ink-faint focus:border-olive focus:ring-1 focus:ring-olive disabled:bg-cream disabled:text-ink-faint" />
                  </label>
                  {stageIdx < 3 ? (
                    <p className="text-xs text-ink-faint">You can add this once the order is packed.</p>
                  ) : (
                    <button onClick={() => save({ deliveryBarcode: tracking.trim() || null }, "Tracking number saved. The customer sees it on their account.")}
                      disabled={busy || (tracking.trim() || null) === (order.deliveryBarcode || null)}
                      className="self-start rounded-lg border border-ink px-4 py-2 text-xs font-semibold text-ink hover:bg-ink hover:text-cream transition-colors disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-ink">
                      Save tracking number
                    </button>
                  )}
                </div>
              </Card>

              <Card className="px-5 py-4 text-xs text-ink-faint flex flex-col gap-1">
                <p>Placed {fmtDate(order.createdAt)} at {fmtTime(order.createdAt)}</p>
                {order.updatedAt && <p>Last updated {ago(order.updatedAt)}</p>}
                {order.customerAccount && <p>Ordered from account {order.customerAccount}</p>}
              </Card>
            </div>
          </div>

          {reuploadOpen && <ResendSlipDialog order={order} onClose={() => setReuploadOpen(false)} />}
          {confirm === "cancel" && <ConfirmDialog danger title="Cancel this order?" confirmLabel="Cancel order"
            text={`${order.orderId} (${order.customerName}, ${order.amount}) will be marked as cancelled — for example when the payment never arrived or the customer changed their mind. You can still set it back to another stage later.`}
            onConfirm={() => save({ status: "Cancelled" }, `${order.orderId} cancelled.`)} onClose={() => setConfirm(null)} />}
          {confirm === "delete" && <ConfirmDialog danger title="Delete this order?" text={deleteText(order)} confirmLabel="Delete order"
            onConfirm={() => onDelete(order.orderId)} onClose={() => setConfirm(null)} />}

          {/* slip lightbox */}
          {zoom && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4" onClick={() => setZoom(false)}>
              <div className="bg-cream-card rounded-xl w-full max-w-3xl overflow-hidden" onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center justify-between px-5 py-3 border-b border-cream-line">
                  <p className="text-sm font-semibold">Payment slip · {order.orderId} · expected {order.amount}</p>
                  <button onClick={() => setZoom(false)} className="p-1.5 rounded-lg hover:bg-cream" aria-label="Close"><Icon name="close" /></button>
                </div>
                <div className="bg-cream p-3 max-h-[78vh] overflow-auto grid place-items-center">
                  {slip.type === "application/pdf"
                    ? <iframe src={slip.url} title="Slip PDF" className="w-full h-[72vh] bg-white rounded" />
                    : <img src={slip.url} alt="Payment slip, enlarged" className="max-h-[74vh] w-auto object-contain" />}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ===================================================================
    // App shell
    // ===================================================================
    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        if (new URLSearchParams(location.search).get("logout") === "true") { clearToken(); return false; }
        return Boolean(getToken());
      });
      const [orders, setOrders] = useState([]);
      const [loadState, setLoadState] = useState("idle"); // idle | loading | ready | error
      const [loadError, setLoadError] = useState(null);
      const [syncedAt, setSyncedAt] = useState(null);
      const [refreshing, setRefreshing] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [query, setQuery] = useState("");
      const [toastMsg, setToastMsg] = useState(null);
      const [route, go] = useRoute();

      const toast = (text, isError = false) => {
        setToastMsg({ text, isError, id: Date.now() });
      };
      useEffect(() => {
        if (!toastMsg) return;
        const t = setTimeout(() => setToastMsg(null), 4500);
        return () => clearTimeout(t);
      }, [toastMsg]);

      const logout = () => { clearToken(); setIsAuthenticated(false); };

      const loadOrders = async () => {
        setRefreshing(true);
        setLoadState((s) => (s === "ready" ? "ready" : "loading"));
        try {
          const data = await (await api("/admin/orders")).json();
          setOrders(data.orders);
          setLoadState("ready");
          setSyncedAt(new Date().toISOString());
        } catch (err) {
          if (err instanceof AuthError) { setIsAuthenticated(false); return; }
          setLoadError(err.message);
          setLoadState((s) => (s === "ready" ? "ready" : "error"));
          toast(`Couldn't refresh orders: ${err.message}`, true);
        } finally {
          setRefreshing(false);
        }
      };

      useEffect(() => {
        if (!isAuthenticated) return;
        loadOrders();
        const timer = setInterval(loadOrders, 60000); // pick up new orders every minute
        return () => clearInterval(timer);
      }, [isAuthenticated]);

      const saveOrder = async (id, patch) => {
        try {
          const { order } = await (await api(`/admin/orders/${id}`, {
            method: "PATCH",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(patch)
          })).json();
          setOrders((prev) => prev.map((o) => (o.orderId === order.orderId ? order : o)));
          return order;
        } catch (err) {
          if (err instanceof AuthError) setIsAuthenticated(false);
          throw err;
        }
      };

      const deleteOrder = async (id) => {
        try {
          await api(`/admin/orders/${id}`, { method: "DELETE" });
          setOrders((prev) => prev.filter((o) => o.orderId !== id));
          toast(`${id} deleted. It's still in the Excel download.`);
          if (location.hash === "#/order/" + id) location.hash = "#/orders";
        } catch (err) {
          if (err instanceof AuthError) setIsAuthenticated(false);
          toast(err.message, true);
          throw err;
        }
      };

      const counts = useMemo(() => {
        const c = { all: orders.length };
        STAGES.forEach((s) => { c[s.value] = orders.filter((o) => o.status === s.value).length; });
        return c;
      }, [orders]);

      // keep the browser tab title useful: (3) when slips are waiting
      useEffect(() => {
        const n = counts["Payment Pending"] || 0;
        document.title = `${n ? `(${n}) ` : ""}Cintamani — Admin`;
      }, [counts]);

      if (!isAuthenticated) return <Login onLoginSuccess={() => setIsAuthenticated(true)} />;

      const [view, sub] = route;
      let title = "Overview", subtitle = "What needs doing today", back = null, body = null;

      if (loadState !== "ready") {
        body = loadState === "error"
          ? <Card className="p-8 text-center"><p className="text-sm text-red-800 mb-3">Couldn't load orders: {loadError}</p><button onClick={loadOrders} className="rounded-lg bg-ink text-cream px-4 py-2 text-sm">Try again</button></Card>
          : <div className="py-24 grid place-items-center text-ink-faint"><Icon name="progress_activity" className="animate-spin text-3xl" /></div>;
      } else if (view === "order") {
        const order = orders.find((o) => o.orderId === sub);
        back = "#/orders" + (order ? "/" + stageOf(order.status).slug : "");
        if (order) {
          title = `Order ${order.orderId}`;
          subtitle = `${order.customerName} · ${order.amount} · ${stageOf(order.status).label}`;
          body = <OrderDetail order={order} onSave={saveOrder} onDelete={deleteOrder} toast={toast} />;
        } else {
          title = "Order not found";
          body = <Card><Empty icon="search_off" text="This order doesn't exist (it may have been removed)." /></Card>;
        }
      } else if (view === "orders") {
        const stage = stageBySlug(sub);
        title = stage ? stage.label : "All orders";
        subtitle = stage
          ? { verify: "New orders waiting for you to check the payment slip", accepted: "Paid and confirmed — ready to start tailoring", tailoring: "Being cut and sewn", packed: "Packed — add the tracking number and dispatch", dispatched: "On the way — mark as completed once delivered", completed: "Delivered and done — delete them when you no longer need them here", cancelled: "Cancelled orders — delete them when you no longer need them here" }[stage.slug]
          : "Every order, newest first";
        body = <OrdersList orders={orders} stage={stage} query={query} setQuery={setQuery} onDelete={deleteOrder} />;
      } else if (view === "customers") {
        title = "Customers";
        subtitle = "Everyone who has placed an order";
        body = <Customers orders={orders} setQuery={setQuery} />;
      } else {
        body = <Overview orders={orders} counts={counts} go={go} />;
      }

      return (
        <div className="min-h-screen">
          <Sidebar route={route} go={go} counts={counts} open={menuOpen} onClose={() => setMenuOpen(false)} onLogout={logout} />

          <div className="lg:pl-64">
            <TopBar title={title} subtitle={subtitle} back={back} onMenu={() => setMenuOpen(true)} onRefresh={loadOrders} syncedAt={syncedAt} refreshing={refreshing} onExport={() => downloadExcel(toast)} />
            <main className="px-4 sm:px-8 py-6 max-w-[1400px]">{body}</main>
          </div>

          {toastMsg && (
            <div key={toastMsg.id} role="status" className={`fixed bottom-5 right-5 z-50 max-w-sm flex items-start gap-3 rounded-xl px-4 py-3 shadow-lg text-sm ${toastMsg.isError ? "bg-red-900 text-white" : "bg-night text-cream"}`}>
              <Icon name={toastMsg.isError ? "error" : "check_circle"} className={`text-lg ${toastMsg.isError ? "" : "text-gold"}`} />
              <span className="flex-1">{toastMsg.text}</span>
              <button onClick={() => setToastMsg(null)} className="opacity-60 hover:opacity-100" aria-label="Dismiss"><Icon name="close" className="text-base" /></button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
