# Cintamani Linens — nginx site for cintamaniceylon.com
# Install: cp to /etc/nginx/sites-available/cintamaniceylon.com, then `nginx -t` BEFORE reloading
# (this server also hosts other sites; a broken config must never be reloaded).
#
# - clean addresses: /about serves about.html; /about.html and /index.html redirect (301)
# - old product links /art/u-N(.html) redirect to /collection/<slug>
# - /api/* goes to the Node order API on 127.0.0.1:8888 (pm2 app "cintamani-api")
# - /admin asks for an extra password (nginx basic auth) before the page even loads

# old product addresses -> readable ones (names must stay unique on this server: cm_ prefix)
map $uri $cm_old_product {
    default "";
    ~^/art/u-1(\.html)?$  /collection/seetha-dress;
    ~^/art/u-2(\.html)?$  /collection/leela-co-ord;
    ~^/art/u-3(\.html)?$  /collection/meena-dress;
    ~^/art/u-4(\.html)?$  /collection/devi-dress;
    ~^/art/u-5(\.html)?$  /collection/roja-shirt;
    ~^/art/u-6(\.html)?$  /collection/sumana-co-ord;
    ~^/art/u-7(\.html)?$  /collection/susila-dress;
    ~^/art/u-8(\.html)?$  /collection/anula-dress;
    ~^/art/u-9(\.html)?$  /collection/amala-dress;
    ~^/art/u-10(\.html)?$ /collection/chandra-co-ord;
    ~^/art/u-11(\.html)?$ /collection/nila-dress;
    ~^/art/u-12(\.html)?$ /collection/manike-co-ord;
}

# slow down password guessing on the sign-in endpoints (per visitor IP)
limit_req_zone $binary_remote_addr zone=cm_login:10m rate=10r/m;

# http -> https, and www -> the main address
server {
    listen 80;
    listen [::]:80;
    server_name cintamaniceylon.com www.cintamaniceylon.com;
    # certificate renewals (Let's Encrypt) check this address over plain http
    location ^~ /.well-known/acme-challenge/ { root /var/www/cintamaniceylon.com/frontend_assets; }
    location / { return 301 https://cintamaniceylon.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.cintamaniceylon.com;
    ssl_certificate /etc/letsencrypt/live/cintamaniceylon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cintamaniceylon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://cintamaniceylon.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cintamaniceylon.com;
    ssl_certificate /etc/letsencrypt/live/cintamaniceylon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cintamaniceylon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/cintamaniceylon.com/frontend_assets;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # compress text files (the server-wide default only compresses HTML); CSS/JS shrink ~80%
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/xml text/plain;

    # --- redirects to the clean addresses (only for addresses typed or linked from outside) ---
    if ($cm_old_product) { return 301 $cm_old_product; }
    if ($request_uri ~ ^/index(\.html)?(\?.*)?$) { return 301 /$2; }
    if ($request_uri ~ ^/(.+)\.html(\?.*)?$) { return 301 /$1$2; }

    # no hidden files (.env lives outside this folder anyway); certificate checks still allowed
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # admin page: extra password before the page loads (the admin's own sign-in still follows)
    location = /admin {
        auth_basic "Cintamani admin";
        auth_basic_user_file /etc/nginx/cintamani-admin.htpasswd;
        add_header Cache-Control "no-store" always;
        try_files /admin.html =404;
    }
    location ^~ /admin/ { return 301 /admin; }

    # order API (Node, pm2 "cintamani-api")
    location /api/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;   # bank slips are capped at 5 MB
    }
    location ~ ^/api/(admin|account)/login$ {
        limit_req zone=cm_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # images can be cached a while (changed photos get new file names); styles and scripts
    # briefly so updates show up quickly
    location ~* \.(jpg|jpeg|png|webp|avif|gif|svg|ico|woff2?|mp4)$ {
        expires 30d;
        try_files $uri =404;
    }
    location ~* \.(css|js)$ {
        expires 1h;
        try_files $uri =404;
    }
}
