[build]
  publish = "frontend_assets"

[[redirects]]
  from = "/art/:slug"
  to = "/art/:slug.html"
  status = 200

[[redirects]]
  from = "/art/:slug/"
  to = "/art/:slug.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200


# Order API (netlify/functions/api.mjs serves /api/*)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
